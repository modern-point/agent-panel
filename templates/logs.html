<!DOCTYPE html>
<html>
<head>
    <title>Agent – Logi</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<h2>Logi działania</h2>

<table>
    <tr>
        <th>Czas</th>
        <th>Wiadomość</th>
    </tr>

    {% for log in logs %}
    <tr>
        <td>{{ log[0] }}</td>
        <td>{{ log[1] }}</td>
    </tr>
    {% endfor %}
</table>

<br>
<a href="/settings">Powrót</a>

</body>
</html>
